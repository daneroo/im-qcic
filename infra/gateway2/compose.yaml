# gateway2 - the replacement Gateway VM on Syno, running an additive-only
# workload alongside the real `infra/gateway`. Nothing here changes the state
# of anything currently running.
#
# This file is a COPY of v2/infra/compose.yaml. Keep the two in sync. Run
# `diff v2/infra/compose.yaml infra/gateway2/compose.yaml` - the delta is
# deliberately only:
#   1. this header
#   2. build contexts are `../../v2` instead of `..`
#   3. the `caddy` service, appended at the end (not in v2/infra)
#   4. v2/infra's "Future idea ... natural place to test Caddy" comment on
#      the nats service is dropped - Caddy is built here, so it is no longer
#      a future idea
#   5. health's HOSTALIAS is set explicitly rather than taking v2/infra's
#      `${HOSTALIAS:-v2-dev}` dev default - see the comment on that line
# Services are kept in v2/infra's order so `diff` against it stays readable.
#
# The `nats` digest pin is now duplicated here - updating the pin means
# updating BOTH files (see v2/AGENTS.md, "Digest-pinned base images").
#
# `gateway2` is a transitory name; at least one more iteration of the
# replacement server is expected. Nothing outside this directory is named
# after the host.
#
# Run from within infra/gateway2/:
#   docker compose up -d --build

services:
  nats:
    image: nats:2-alpine@sha256:f2123f533c2b0cada0a5c5ec434fb2b8cfe1cf220215ef9d7517e1372917ad66
    restart: unless-stopped
    volumes:
      - ./config/nats/nats-server.conf:/etc/nats/nats-server.conf
      - ./data/nats:/data
    # No explicit command: the image's own default CMD is already
    # `nats-server --config /etc/nats/nats-server.conf` - confirmed via
    # `docker inspect`, not assumed.
    ports:
      - "4222:4222" # clients
      - "8222:8222" # monitoring
      - "9222:9222" # websockets (for web)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  health:
    build:
      context: ../../v2
      dockerfile: apps/health/Dockerfile
    restart: unless-stopped
    depends_on:
      - nats
    environment:
      # Set explicitly, not left to v2/infra's `${HOSTALIAS:-v2-dev}` dev
      # default. Two things defeat health's own `HOSTALIAS || hostname`
      # fallback here: compose injects the literal default so the fallback
      # never fires, and a container's hostname is its container ID, not the
      # VM's name. Without this every reading's byline would read "v2-dev".
      HOSTALIAS: gateway2
      NATS_SERVERS: nats:4222
      NATS_MONITOR_URL: http://nats:8222
      TAILSCALE_LOCALAPI_MODE: ${TAILSCALE_LOCALAPI_MODE:-unix}
      TAILSCALE_CREDENTIAL_PATH: /run/secrets/tailscale-localapi.json
    volumes:
      - type: bind
        source: ${TAILSCALE_LOCALAPI_SOURCE:-/run/tailscale/tailscaled.sock}
        target: ${TAILSCALE_LOCALAPI_TARGET:-/run/tailscale/tailscaled.sock}
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ted1k-derive:
    build:
      context: ../../v2
      dockerfile: apps/ted1k-derive/Dockerfile
    restart: unless-stopped
    depends_on:
      - nats
    environment:
      # credentials.nats.json's "localhost:4222" is only correct for
      # bare-metal dev - "localhost" inside this network is the container
      # itself, not the nats service (see config.ts's comment) - so this
      # container doesn't need that credential file mounted at all.
      NATS_SERVERS: nats:4222
    volumes:
      - ./credentials/credentials.mysql.json:/usr/src/app/infra/credentials/credentials.mysql.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  scast-bridge:
    build:
      context: ../../v2
      dockerfile: apps/scast-bridge/Dockerfile
    restart: unless-stopped
    depends_on:
      - nats
    environment:
      # Same override as ted1k-derive's - see its comment above. Only the
      # write side (nats, the new server) needs it; natsProd already names
      # a real external host (nats.ts.imetrical.com), unaffected by which
      # network this container runs in.
      NATS_SERVERS: nats:4222
    volumes:
      - ./credentials/credentials.nats-prod.json:/usr/src/app/infra/credentials/credentials.nats-prod.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # --- not in v2/infra: the whole delta ---------------------------------
  # Same build recipe as infra/gateway's caddy (xcaddy + the cloudflare DNS
  # provider), copied rather than referenced so nothing here reads a file
  # production depends on.
  caddy:
    build:
      context: .
      dockerfile: Dockerfile-caddy
    # No explicit `image:`. Compose names this `gateway2-caddy` from the
    # project prefix, matching the other three built services. It previously
    # read `qcic-caddy:latest`, inherited along with the service from
    # infra/gateway - which is production's tag, so building here overwrote
    # it. infra/gateway still carries that name; not worth fixing, since
    # gateway is what gateway2 eventually replaces.
    restart: unless-stopped
    env_file:
      # SHOULD contain CF_API_TOKEN
      - credentials/caddy/CREDS.env
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile
      # Persisted so a restart does not re-run ACME - restart timings would
      # otherwise include a cert round-trip.
      - ./data/caddy:/data
    ports:
      - "80:80"
      - "443:443"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
