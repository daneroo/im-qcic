# v2's own NATS server - genuinely separate from infra/gateway's production
# server (see v2/AGENTS.md). Adapted from infra/gateway/config/nats/nats-server.conf,
# minus the synadia-nightly/websocket workaround that server needed years ago -
# the official image supports websockets natively now.

# Client port of 4222 on all interfaces
port: 4222

# HTTP monitoring port
monitor_port: 8222

# Websocket support, for `web`'s direct browser connection - no tls for now
websocket: {
  port: 9222
  no_tls: true
}

jetstream {
  # nats-server always appends its own "jetstream" subdirectory under
  # store_dir (see nats-server's jetstream.go: EnableJetStream does
  # `StoreDir = filepath.Join(StoreDir, JetStreamStoreDir)`) - so this is
  # deliberately *not* named .../jetstream ourselves, to avoid the
  # redundant .../jetstream/jetstream doubling that infra/gateway has.
  store_dir: /data
  max_memory_store: 1G
  max_file: 10G
}
